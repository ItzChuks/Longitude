<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Longitude Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink: '#12263A', chart: '#E6ECEF', sea: '#0E7C86', air: '#F0562B', road: '#B98700' },
      fontFamily: { display: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'] }
    } } };
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head><body class="bg-white"><div id="demoBanner" hidden class="bg-ink px-5 py-2 text-center text-sm text-white">Demo mode: sign in with any email and password. Add your Appwrite project ID in <code>js/config.js</code> to go live.</div>
<main class="grid min-h-screen lg:grid-cols-2">
<div class="ph relative hidden lg:block"><img src="images/hero.jpg" alt="" class="absolute inset-0 h-full w-full object-cover" onerror="this.remove()"><div class="absolute inset-0 bg-ink/70"></div>
<div class="relative flex h-full flex-col justify-between p-12 text-white"><a href="index.html" class="font-display text-xl font-extrabold">Longitude</a><p class="max-w-sm text-3xl font-extrabold leading-tight">Every shipment, every handover, in one place.</p></div></div>
<div class="grid place-items-center px-5 py-12"><form id="loginForm" class="w-full max-w-sm">
<h1 class="text-3xl font-extrabold">Staff sign in</h1><p class="mt-1 text-sm text-ink/70">Use your Longitude Ops account.</p>
<div class="mt-6"><label class="label" for="email">Email</label><input id="email" type="email" class="field" required autocomplete="username"></div>
<div class="mt-4"><label class="label" for="password">Password</label><input id="password" type="password" class="field" required autocomplete="current-password"></div>
<p id="loginError" class="mt-3 min-h-[1.25rem] text-sm font-medium text-red-700" role="alert"></p>
<button class="btn mt-2 w-full" type="submit" id="loginBtn">Sign in</button><a href="index.html" class="mt-5 inline-block text-sm underline">Back to website</a></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script><script src="js/config.js"></script><script src="js/data.js"></script><script src="js/api.js"></script><script src="js/login.js"></script></body></html>
